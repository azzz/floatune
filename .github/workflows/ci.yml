name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check localizations
        run: python3 scripts/check_strings.py

      - name: Build
        env:
          ARCHS: arm64 x86_64
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./scripts/build.sh
          lipo -archs build/Floatune.app/Contents/MacOS/Floatune

      - name: Package
        run: ditto -c -k --keepParent build/Floatune.app Floatune.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Floatune-${{ github.sha }}
          path: Floatune.zip
          retention-days: 14
