name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          ARCHS: arm64 x86_64
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./scripts/build.sh
          lipo -archs build/Floatune.app/Contents/MacOS/Floatune

      - name: Package
        run: ditto -c -k --keepParent build/Floatune.app "Floatune-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Floatune-${GITHUB_REF_NAME}.zip" \
            --title "Floatune $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
